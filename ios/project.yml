name: HarmonyDirector
options:
  bundleIdPrefix: com.aistudio.harmonydirector
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  HarmonyDirector:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HarmonyDirector/Sources
      - path: HarmonyDirector/Resources/Assets.xcassets
      - path: HarmonyDirector/Resources/Audio
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.harmonydirector.ios
        PRODUCT_NAME: HarmonyDirector
        INFOPLIST_FILE: HarmonyDirector/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMIDI.framework
      - sdk: CoreAudioKit.framework
      - sdk: SwiftUI.framework
  HarmonyDirectorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HarmonyDirectorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.harmonydirector.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: HarmonyDirector
schemes:
  HarmonyDirector:
    build:
      targets:
        HarmonyDirector: all
        HarmonyDirectorTests: [test]
    test:
      config: Debug
      targets:
        - HarmonyDirectorTests
    archive:
      config: Release
